<div class="earning-card warning overflow-hidden rounded">
  <div class="card total-income-card  overflow-hidden p-4">
    <form [formGroup]="ticketForm" (ngSubmit)="submit()">



      <!-- عنوان القسم -->
      <div class="doctor-header d-flex  align-items-center m-2">
        <div class="d-flex flex-column">
          <div class="d-flex  header-title">

            <i class="ti ti-ticket icon-animate mb-3" style="font-size: 25px; color: #673ab7;"></i>
            <h2 class="mb-3 mx-2">
              Create Ticket
            </h2>
          </div>

        </div>

      </div>



      <div class="row">
        <!-- Title -->
        <div class="col-md-12 mb-3 d-flex align-items-center">
          <label class="form-label col-md-2">Title</label>
          <input type="text" class="form-control w-50" formControlName="title" placeholder="Enter ticket title" />
          <app-validation-error [form]="ticketForm" controlName="title"></app-validation-error>
        </div>


        <!-- <div class="col-md-6 mb-3" hidden>
          <label class="form-label">Ticket Type</label>
          <input type="text" class="form-control" [value]="patientId ? 'To Patient' : 'To Admin'" readonly />
        </div> -->



        <!-- Description -->
        <div class="col-md-12 mb-3 d-flex align-items-center">
          <label class="form-label col-md-2">Description</label>
          <textarea class="form-control" rows="4" formControlName="description" placeholder="Enter ticket description">
          </textarea>
          <app-validation-error [form]="ticketForm" controlName="description"></app-validation-error>
        </div>

        <!-- Patient (Readonly if from route) -->
        <div class=" mb-3" *ngIf="patientId" hidden>
          <label class="form-label">Patient ID</label>
          <input type="text" class="form-control" formControlName="targetUserId" readonly />
        </div>
      </div>

      <!-- Actions -->
      <div class="d-flex justify-content-end gap-2">
        <button class="btn btn-save" type="submit" [disabled]="ticketForm.invalid">
          <span> <i class="ti ti-send me-1"></i>
            Submit Ticket</span>
        </button>
      </div>





    </form>

  </div>
</div>
