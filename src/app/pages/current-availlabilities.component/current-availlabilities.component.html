<!-- 🩺 بيانات  المريض -->
<div class="doctor-header d-flex justify-content-between align-items-center">
  <div class="d-flex flex-column">
    <div class="d-flex align-items-center header-title">
      <i class="ti ti-stethoscope icon-animate"></i>
      <h2 class="mb-2">{{ 'CURRENT_AVAILABILITIES.TITLE' | translate }}</h2>
    </div>
    <p style="color: gray">{{ 'CURRENT_AVAILABILITIES.DESCRIPTION' | translate }}</p>
  </div>
</div>

<div class="card p-4">
  <div *ngIf="doctoravailabilities">
    <!-- Patient Form -->
    <div class="card p-3 mb-4 shadow-sm border-0">
      <h3 class="mb-3">{{ 'PATIENT.TITLE' | translate }}</h3>

      <form [formGroup]="patient" (ngSubmit)="onSubmit()" class="pt-4 pb-4">
        <div class="row">
          <div class="col-md-6">
            <label class="form-label">{{ 'PATIENT.PHONE' | translate }}</label>
            <input type="text" formControlName="phoneNumber" class="form-control" (blur)="onPhoneBlur()" />
            <app-validation-error [form]="patient" controlName="phoneNumber"></app-validation-error>
          </div>

          <div class="col-md-6">
            <label class="form-label">{{ 'PATIENT.NAME' | translate }}</label>
            <input type="text" formControlName="fullName" class="form-control" />
            <app-validation-error [form]="patient" controlName="fullName"></app-validation-error>
          </div>

          <div class="col-md-6 mt-3">
            <label class="form-label">{{ 'APPOINTMENT.STATUS' | translate }}</label>
            <select class="form-control" formControlName="status">
              <option *ngFor="let status of statusOptions" [value]="status">
                {{ 'APPOINTMENT.STATUS_' + status.toUpperCase() | translate }}
              </option>
            </select>
          </div>

          <div class="col-md-6 mt-3">
            <label class="form-label">{{ 'APPOINTMENT.NOTES' | translate }}</label>
            <textarea formControlName="notes" class="form-control" rows="3" placeholder="Enter any notes..."></textarea>
          </div>
        </div>

        <div class="text-center my-3">
          <ng-container *ngIf="selectedTime; else noSelection">
            <label class="fw-bold text-primary" style="font-size: larger;">
              <i class="bi bi-clock me-2"></i>
              {{ 'TIME.LABEL' | translate }}
              <span class="text-dark">{{ selectedTime }}</span>
              <span *ngIf="selectedDate"> ({{ selectedDate | date }})</span>
            </label>
          </ng-container>

          <ng-template #noSelection>
            <label class="text-muted">
              <i class="bi bi-exclamation-circle me-2 ms-2"></i>
              {{ 'TIME.NO_SELECTION' | translate }}
            </label>
          </ng-template>
        </div>



        <button class="btn btn-save mt-3" type="submit">{{ 'PATIENT.SUBMIT' | translate }}</button>



      </form>
    </div>

    <!-- Outer Accordion: Addresses -->
    <!-- Outer Accordion -->
    <div class="accordion" id="availabilitiesAccordion">
      <div *ngFor="let a of doctoravailabilities?.availableAppointments; let appointmentIndex = index"
        class="accordion-item mb-3 shadow-sm border-0">
        <h2 class="accordion-header" [id]="'heading-' + appointmentIndex">
          <button class="accordion-button" type="button" [class.collapsed]="openedOuterIndex !== appointmentIndex"
            (click)="toggleOuter(appointmentIndex)" [attr.aria-expanded]="openedOuterIndex === appointmentIndex"
            attr.aria-controls="{{ 'outer-collapse-' + appointmentIndex }}"
            style="background-color: rgb(224, 215, 240); color: #673ab7">
            <i class="ti ti-map-pin text-primary me-2"></i>
            {{ a.addressName }} ({{ a.city }}, {{ a.region }})
          </button>
        </h2>

        <!-- IMPORTANT: keep 'collapse' class always, toggle 'show' -->
        <div [id]="'outer-collapse-' + appointmentIndex" class="accordion-collapse collapse"
          [class.show]="openedOuterIndex === appointmentIndex" [attr.aria-labelledby]="'heading-' + appointmentIndex">
          <div class="accordion-body">
            <!-- Inner Accordion -->
            <div class="accordion" [id]="'innerAccordion-' + appointmentIndex">
              <div *ngFor="let group of a.groupedItems | keyvalue; let groupedIndex = index"
                class="accordion-item mt-2">
                <h2 class="accordion-header" [id]="'inner-heading-' + appointmentIndex + '-' + groupedIndex">
                  <button class="accordion-button" type="button"
                    [class.collapsed]="openedInnerIndex[appointmentIndex] !== groupedIndex"
                    (click)="toggleInner(appointmentIndex, groupedIndex)"
                    [attr.aria-expanded]="openedInnerIndex[appointmentIndex] === groupedIndex"
                    attr.aria-controls="{{ 'inner-collapse-' + appointmentIndex + '-' + groupedIndex }}"
                    style="background-color: rgb(224, 207, 252)">
                    {{ group.key }}
                    <strong class="text-muted ms-2">
                      <i class="bi bi-calendar me-2"></i>
                      {{ group.value[0]?.appointmentDate | date: 'mediumDate' }}
                    </strong>
                  </button>
                </h2>

                <div [id]="'inner-collapse-' + appointmentIndex + '-' + groupedIndex"
                  class="accordion-collapse collapse" [class.show]="openedInnerIndex[appointmentIndex] === groupedIndex"
                  [attr.aria-labelledby]="'inner-heading-' + appointmentIndex + '-' + groupedIndex">
                  <div class="accordion-body">
                    <div class="d-flex flex-wrap gap-3 justify-content-center">
                      <div *ngFor="let t of group.value" class="border rounded shadow-sm p-3 bg-light time-card"
                        style="min-width: 180px; max-width: 220px; cursor: pointer" (click)="selectTime(t)"
                        [class.selected]="isSelected(t)">
                        <div class="fw-bold text-center">
                          <i class="bi bi-clock me-2"></i>
                          {{ t.time }}
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <!-- end inner collapse -->
              </div>
            </div>
            <!-- end inner accordion -->
          </div>
        </div>
        <!-- end outer collapse -->
      </div>
    </div>

    <!-- End Outer Accordion -->
  </div>
</div>

<!-- 🔄 Loading State -->
<ng-template #loading>
  <div class="text-center py-5">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-2">Loading...</p>
  </div>
</ng-template>
