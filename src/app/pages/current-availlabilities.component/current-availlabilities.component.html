<!-- 🩺 بيانات الطبيب -->
<div class="doctor-header d-flex justify-content-between align-items-center">
  <div class="d-flex flex-column">
    <div class="d-flex align-items-center header-title">
      <i class="ti ti-stethoscope icon-animate"></i>
      <h2 class="mb-2">{{ 'CURRENT_AVAILABILITIES.TITLE' | translate }}</h2>
    </div>
    <p style="color: gray">{{ 'CURRENT_AVAILABILITIES.DESCRIPTION' | translate }}</p>
  </div>
</div>

<div class="card p-4">
  <div *ngIf="doctoravailabilities">
    <!-- Patient Form -->
    <div class="card p-3 mb-4 shadow-sm border-0">
      <h3 class="mb-3">{{ 'PATIENT.TITLE' | translate }}</h3>

      <form [formGroup]="patient" (ngSubmit)="onSubmit()" class="pt-4 pb-4">
        <div class="row">
          <div class="col-md-6">
            <label class="form-label">{{ 'PATIENT.PHONE' | translate }}</label>
            <input type="text" formControlName="phoneNumber" class="form-control" (blur)="onPhoneBlur()" />
            <div *ngIf="patient.get('phoneNumber')?.invalid && patient.get('phoneNumber')?.touched" class="text-danger">
              Please enter a valid phone number
            </div>
          </div>

          <div class="col-md-6">
            <label class="form-label">{{ 'PATIENT.NAME' | translate }}</label>
            <input type="text" formControlName="fullName" class="form-control" />
            <div *ngIf="patient.get('fullName')?.invalid && patient.get('fullName')?.touched" class="text-danger">
              {{ 'PATIENT.NAME_ERROR' | translate }}
            </div>
          </div>

          <div class="col-md-6 mt-3">
            <label class="form-label">{{ 'APPOINTMENT.STATUS' | translate }}</label>
            <select class="form-control" formControlName="status">
              <option *ngFor="let status of statusOptions" [value]="status">
                {{ 'APPOINTMENT.STATUS_' + status.toUpperCase() | translate }}
              </option>
            </select>
          </div>

          <div class="col-md-6 mt-3">
            <label class="form-label">{{ 'APPOINTMENT.NOTES' | translate }}</label>
            <textarea formControlName="notes" class="form-control" rows="3" placeholder="Enter any notes..."></textarea>
          </div>
        </div>

        <button class="btn btn-save mt-3" type="submit">{{ 'PATIENT.SUBMIT' | translate }}</button>
      </form>
    </div>

    <!-- Outer Accordion: Addresses -->
    <div *ngFor="let a of doctoravailabilities.availableAppointments; let appointmentIndex = index" class="mb-3">
      <div class="accordion" [id]="'availabilitiesAccordion' + appointmentIndex">
        <div class="accordion-item shadow-sm border-0">
          <h2 class="accordion-header" [id]="'heading' + appointmentIndex">
            <button
              class="accordion-button collapsed d-flex justify-content-between align-items-center"
              type="button"
              data-bs-toggle="collapse"
              [attr.data-bs-target]="'#collapse' + appointmentIndex"
              aria-expanded="false"
              [attr.aria-controls]="'collapse' + appointmentIndex"
              style="background-color: rgb(224.6, 215.6, 240.6); color: #673ab7"
            >
              <div>
                <i class="ti ti-map-pin text-primary me-2"></i>
                {{ a.addressName }} ({{ a.city }}, {{ a.region }})
              </div>
            </button>
          </h2>

          <div
            [id]="'collapse' + appointmentIndex"
            class="accordion-collapse collapse"
            [attr.aria-labelledby]="'heading' + appointmentIndex"
            [attr.data-bs-parent]="'#availabilitiesAccordion' + appointmentIndex"
          >
            <div class="accordion-body">
              <!-- Inner Accordion: Days (Independent) -->
              <div *ngFor="let group of a.groupedItems | keyvalue; let groupedIndex = index" class="accordion mt-3">
                <div class="accordion-item">
                  <h2 class="accordion-header" [id]="'heading-' + appointmentIndex + '-' + groupedIndex">
                    <button
                      class="accordion-button collapsed"
                      type="button"
                      data-bs-toggle="collapse"
                      [attr.data-bs-target]="'#collapse-' + appointmentIndex + '-' + groupedIndex"
                      aria-expanded="false"
                      [attr.aria-controls]="'collapse-' + appointmentIndex + '-' + groupedIndex"
                      style="background-color: rgb(224, 207, 252)"
                    >
                      {{ group.key }}
                      <strong class="text-muted ms-2">
                        <i class="bi bi-calendar me-2"></i>
                        {{ group.value[0]?.appointmentDate | date: 'mediumDate' }}
                      </strong>
                    </button>
                  </h2>

                  <div
                    [id]="'collapse-' + appointmentIndex + '-' + groupedIndex"
                    class="accordion-collapse collapse"
                    [attr.aria-labelledby]="'heading-' + appointmentIndex + '-' + groupedIndex"
                  >
                    <div class="accordion-body">
                      <div class="d-flex flex-wrap gap-3 justify-content-center">
                        <div
                          *ngFor="let t of group.value"
                          class="border rounded shadow-sm p-3 bg-light time-card"
                          style="min-width: 180px; max-width: 220px; cursor: pointer"
                          (click)="selectTime(t)"
                          [class.selected]="patient.get('doctorAvailabilityId')?.value === t.doctorAvailabilityId"
                        >
                          <div class="fw-bold text-primary text-center">
                            <i class="bi bi-clock me-2"></i>
                            {{ t.time }}
                          </div>
                          <div class="text-muted text-center">
                            <i class="bi bi-calendar me-2"></i>
                            {{ t.appointmentDate | date: 'mediumDate' }}
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <!-- End Inner Accordion -->
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- End Outer Accordion -->
  </div>
</div>

<!-- 🔄 Loading State -->
<ng-template #loading>
  <div class="text-center py-5">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-2">Loading...</p>
  </div>
</ng-template>
