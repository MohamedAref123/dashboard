<div class="dialog-body">
  <div class="earning-card warning overflow-hidden rounded">
    <span class="round secondary-round small"></span>
    <span class="round secondary-round big"></span>

    <div class="card w-100 mx-auto h-100" style="margin-bottom: unset" [dir]="currentLang === 'ar' ? 'rtl' : 'ltr'">
      <div class="card-body d-flex flex-column h-100" *ngIf="form">
        <form [formGroup]="form" (ngSubmit)="save()" novalidate class="d-flex flex-column h-100">
          <!-- Header -->
          <h2 class="mb-4 text-center" style="color: #673ab7">
            {{ 'ADDRESS.UPDATE_TITLE' | translate }}
          </h2>

          <!-- Scrollable Content -->
          <div class="flex-grow-1 overflow-auto px-1">
            <div *ngIf="isLoading" class="text-center my-3">
              <div class="spinner-border text-secondary" role="status"></div>
            </div>

            <div *ngIf="!isLoading">
              <div class="border p-3 mb-3 rounded">
                <!-- Address Fields -->
                <div class="row g-2">
                  <div class="col-md-6">
                    <label class="form-label">{{'PROFILE.ADDRESS'|translate}}</label>
                    <input class="form-control" [placeholder]="'ADDRESS.NAME' | translate"
                      formControlName="addressName" />
                  </div>

                  <div class="col-md-6">
                    <label class="form-label">{{'PROFILE.CITY'|translate}}</label>
                    <select class="form-control" formControlName="cityId"
                      (change)="loadRegions(currentLang, $event.target['value'])">
                      <option value="" disabled selected>
                        {{ 'ADDRESS.SELECT_CITY' | translate }}
                      </option>
                      <option *ngFor="let c of city" [value]="c.value">
                        {{ c.text }}
                      </option>
                    </select>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label">{{'PROFILE.REGION'|translate}}</label>
                    <select class="form-control" formControlName="regionId">
                      <option value="" disabled selected>
                        {{ 'ADDRESS.SELECT_REGION' | translate }}
                      </option>
                      <option *ngFor="let r of regions" [value]="r.value">
                        {{ r.text }}
                      </option>
                    </select>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label">{{'PROFILE.POSTAL_CODE'|translate}}</label>
                    <input class="form-control" [placeholder]="'ADDRESS.POSTAL_CODE' | translate"
                      formControlName="postalCode" />
                  </div>

                  <div class="col-md-6">
                    <label class="form-label">{{'PROFILE.STREET'|translate}}</label>
                    <input class="form-control" [placeholder]="'ADDRESS.STREET' | translate" formControlName="street" />
                  </div>

                  <div class="col-md-6">
                    <label class="form-label">{{'PROFILE.BUILDING_NUMBER'|translate}}</label>
                    <input class="form-control" [placeholder]="'ADDRESS.BUILDING_NUMBER' | translate"
                      formControlName="buildingNumber" />
                  </div>

                  <div class="col-md-6">
                    <label class="form-label">{{'PROFILE.PHONE'|translate}}</label>
                    <input class="form-control" [placeholder]="'ADDRESS.PHONE' | translate"
                      formControlName="phoneNumber" />
                  </div>

                  <div class="col-md-6">
                    <label class="form-label">{{'ADDRESS.GOOGLE_LOCATION'|translate}}</label>
                    <input class="form-control" [placeholder]="'ADDRESS.GOOGLE_LOCATION' | translate"
                      formControlName="googleLocation" />
                  </div>

                  <div class="col-md-6">
                    <div class="form-check mt-4">
                      <input class="form-check-input" id="addresIsDeleted" type="checkbox"
                        formControlName="isDeleted" />
                      <label class="form-check-label" for="addresIsDeleted">
                        {{ 'ADDRESS.IS_DELETED' | translate }}
                      </label>
                    </div>
                  </div>

                </div>

                <!-- Availabilities -->
                <div class="d-flex align-items-center mt-3">
                  <h6 class="me-3 ms-3">{{ 'AVAILABILITY.TITLE' | translate }}</h6>
                  <button type="button" class="btn btn-secondary btn-light mb-2" (click)="addAvailability()">
                    +
                  </button>
                </div>

                <div formArrayName="availabilities">
                  <div *ngFor="let avail of getAvailabilities().controls; let j = index" [formGroupName]="j"
                    class="row g-2 align-items-center mb-2">


                    <div class="col-12 col-md-2">
                      <label class="form-label">{{ 'AVAILABILITY.DAY' | translate }}</label>
                      <mat-select formControlName="dayOfWeek" class="form-control">
                        <mat-option *ngFor="let day of days" [value]="day.value">
                          {{ day.text }}
                        </mat-option>
                      </mat-select>
                    </div>

                    <div class="col-12 col-md-2">
                      <label class="form-label">{{ 'AVAILABILITY.CATEGORY_TYPE' | translate }}</label>
                      <mat-select formControlName="category" class="form-control">

                        <mat-option *ngFor="let category of appointmentCategories" [value]="category.value">
                          {{ 'AVAILABILITY.' + (category.value === 0 ? 'EXAMINATION' : 'CONSULTATION') | translate }}
                        </mat-option>

                      </mat-select>
                    </div>


                    <div class="col-12 col-md-2">
                      <label class="form-label">{{ 'AVAILABILITY.START' | translate }}</label>
                      <input type="time" class="form-control" formControlName="startTime" />
                    </div>

                    <div class="col-12 col-md-2">
                      <label class="form-label">{{ 'AVAILABILITY.END' | translate }}</label>
                      <input type="time" class="form-control" formControlName="endTime" />
                    </div>

                    <div class="col-12 col-md-2">
                      <label class="form-label">{{ 'AVAILABILITY.SLOT_TIME' | translate }}</label>
                      <input type="number" min="1" class="form-control" formControlName="slotTime"
                        [placeholder]="'AVAILABILITY.SLOT_PLACEHOLDER' | translate" />
                      <app-validation-error [form]="avail" controlName="slotTime"></app-validation-error>
                    </div>

                    <div class="col-12 col-md-2">
                      <div class="form-check mt-4">
                        <input class="form-check-input" id="{{ j }}" type="checkbox" formControlName="isDeleted" />
                        <label class="form-check-label" for="{{ j }}">
                          {{ 'AVAILABILITY.IS_DELETED' | translate }}
                        </label>
                      </div>
                    </div>


                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Footer Buttons -->
          <div class="mt-3 d-flex gap-3 justify-content-end">
            <button type="button" class="btn btn-light" (click)="dialogRef.close()">
              {{ 'COMMON.CANCEL' | translate }}
            </button>
            <button type="submit" class="btn btn-secondary">
              {{ 'COMMON.UPDATE' | translate }}
            </button>
          </div>
        </form>
      </div>
    </div>

  </div>
</div>
