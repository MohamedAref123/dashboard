<div class="card total-income-card  overflow-hidden p-4">

  <div class="doctor-header d-flex justify-content-between align-items-center m-2">
    <div class="d-flex flex-column">
      <div class="d-flex  header-title">
        <i class="ti ti-alarm icon-animate" style="font-size: 25px; color: #673ab7"></i>
        <h2 style=" margin-bottom: 15px; margin-right: 10px">{{ 'APPOINTMENT.SEARCH_TITLE' | translate }} </h2>
      </div>
    </div>
  </div>

  <div class="p-3">
    <form [formGroup]="searchForm" (ngSubmit)="searchAppointments()" style="margin-bottom: 20px">
      <div class="row">
        <div class="col-md-3">
          <label class="form-label" style="color: gray">{{ 'APPOINTMENT.FROM_DATE' | translate }}</label>
          <input type="date" class="form-control" formControlName="fromDate" />
        </div>

        <div class="col-md-3">
          <label class="form-label" style="color: gray">{{ 'APPOINTMENT.TO_DATE' | translate }}</label>
          <input type="date" class="form-control" formControlName="toDate" />
        </div>

        <div class="col-md-3">
          <label class="form-label" style="color: gray">{{ 'APPOINTMENT.STATUS' | translate }}</label>
          <select class="form-control" formControlName="status">
            <!-- خيار "كل الحالات" -->
            <option [ngValue]="null">{{ 'APPOINTMENT.STATUS_ALL' | translate }}</option>

            <!-- باقي الحالات -->
            <option *ngFor="let status of statusOptions" [value]="status">
              {{ ('APPOINTMENT.STATUS_' + status.toUpperCase()) | translate }}
            </option>
          </select>
        </div>


        <div class="col-md-3">
          <label class="form-label">{{ 'APPOINTMENT.ADDRESS' | translate }}</label>
          <select class="form-select" formControlName="addressId">
            <option [ngValue]="null">{{ 'APPOINTMENT.ALL' | translate }}</option>
            <option *ngFor="let addr of addresses" [value]="addr.value">
              {{ addr.text }}
            </option>
          </select>
        </div>

        <div class="d-flex w-100 align-items-end justify-content-between g-2">

          <!-- زر البحث على الشمال -->
          <div class="col-md-2 mt-3">
            <button type="submit" class="btn btn-search w-100 mx-2 my-2">
              {{ 'BUTTONS.SEARCH' | translate }}
            </button>
          </div>

        </div>
      </div>
    </form>

    <app-generic-table [_headers]="headers" [_items]="appointments" [_actions]="tableActions"
      (actionClicked)="handleAction($event)" (pageChange)="onPageChange($event)" [pageSize]="pagenation.pageSize"
      [totalRecords]="pagenation.totalRecords" [pageIndex]="pagenation.pageIndex" class="mt-4"
      *ngIf="appointments.length>0"></app-generic-table>

    <div class="mt-4" *ngIf="appointments.length === 0">
      <p>No appointments found.</p>
    </div>
  </div>
</div>
